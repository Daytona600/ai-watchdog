# AI fix assistant (scripts/watchdog_ai_fix.py), added 2026-10-14.
#
# Every warning/critical item on the dashboard gets an analysis from the local
# LLM on the EPYC box: likely cause, a fix plan, how to check it worked. The
# analysis page has a "Fix it with AI" button that opens an OpenCode session
# (EPYC, agent "fixer") where investigating runs freely but every change waits
# for approval in OpenCode. See runbooks/ai-fix-assistant.md.

AI_FIX_ENABLED="1"

# Ollama on the EPYC box (host IP comes from EPYC_LLM_IP in watchdog_known_hosts.conf).
# qwen3.6-coder is the model OpenCode already keeps loaded, so no VRAM swap.
AI_FIX_OLLAMA_PORT="11434"
AI_FIX_MODEL="qwen3.6-coder"
AI_FIX_TIMEOUT_SEC="420"
AI_FIX_NUM_CTX="32768"

# About a minute per analysis; extra items wait for the next run.
AI_FIX_MAX_PER_RUN="6"

# A problem that is still open is analysed again after this many hours.
AI_FIX_REFRESH_HOURS="24"

# OpenCode web on the EPYC box. The password lives in config/opencode_web.env
# (OPENCODE_SERVER_PASSWORD=..., not in git).
AI_FIX_OPENCODE_PORT="4096"
AI_FIX_OPENCODE_AGENT="fixer"
AI_FIX_OPENCODE_DIR="/home/davids1/fix-sessions"

# HA view with the problems card. Notifications link here: HA treats links inside a
# notification as its own pages, so a /watchdog/ link fell through to the first dashboard.
AI_FIX_HA_VIEW="/home-v2/ai-watchdog"

# Base of the analysis pages (the card's links; the /watchdog/ path only answers on the LAN / VPN).
AI_FIX_PUBLIC_BASE="https://ha.magnumz.com/watchdog"
AI_FIX_NOTIFICATION_ID="ai_watchdog_fixes"

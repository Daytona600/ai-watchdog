# AI Watchdog news brief config
#
# Pulls current world/USA headlines via the local SearXNG instance,
# restricted to an allowlist of wire-service domains so results are not
# left to algorithmic search ranking or SEO-driven aggregators.

WATCHDOG_NEWS_ENABLED="1"

SEARXNG_URL="http://10.0.0.35:8181"

# Comma-separated allowlist of domains treated as reliable wire services.
# Any SearXNG result outside this list is dropped before display — same
# enforcement approach as WATCHDOG_LLM_TRUSTED_DOMAINS in watchdog_llm.conf.
WATCHDOG_NEWS_TRUSTED_DOMAINS="apnews.com,reuters.com,npr.org,bbc.com,bbc.co.uk,pbs.org"

# Comma-separated search queries, run independently against SearXNG.
WATCHDOG_NEWS_QUERIES="world news today,United States news today"

# Comma-separated SearXNG engines to use for this query (per-request bang
# selection, not a global engine change). Google and Startpage CAPTCHA/403
# almost immediately and this job runs every 6h via ai-watchdog.timer, which
# was re-triggering their 24h suspension before it ever cleared. DuckDuckGo
# and Brave have been the actual sources of trusted-domain hits in practice.
WATCHDOG_NEWS_ENGINES="duckduckgo,brave"

# Max headlines kept per query after domain filtering.
WATCHDOG_NEWS_MAX_PER_QUERY="6"

WATCHDOG_NEWS_TIMEOUT_SEC="30"

# ---------------------------------------------------------------------------
# Local news — Winnemucca / Imlay / Lovelock, NV (Humboldt & Pershing County)
# ---------------------------------------------------------------------------
WATCHDOG_LOCAL_NEWS_ENABLED="1"
WATCHDOG_LOCAL_NEWS_LABEL="Winnemucca / Imlay / Lovelock, NV"

# mynews4.com (Reno's KRNV) has real Winnemucca beat coverage; humboldtsun.com
# and lovelockreviewminer.com are the local papers for Humboldt/Pershing
# County; elkodaily.com and reviewjournal.com occasionally cover the area
# regionally. All five verified reachable 2026-08-05.
WATCHDOG_LOCAL_NEWS_TRUSTED_DOMAINS="mynews4.com,humboldtsun.com,lovelockreviewminer.com,elkodaily.com,reviewjournal.com"

WATCHDOG_LOCAL_NEWS_QUERIES="Winnemucca Nevada,Lovelock Nevada,Pershing County Nevada,Humboldt County Nevada"

# Local coverage is thin enough that duckduckgo/brave alone often return
# nothing; bing news and qwant news both proved reliable for these small
# outlets during testing (2026-08-05), so they're included here even though
# the national section above sticks to duckduckgo/brave only.
WATCHDOG_LOCAL_NEWS_ENGINES="duckduckgo,brave,bing news,qwant news"

WATCHDOG_LOCAL_NEWS_MAX_PER_QUERY="6"

# Static links (label|url pairs, comma-separated), not search results — no
# scraping/parsing of anything, same "just links, no algorithmic judgment
# call" approach as the rest of this script. All verified reachable
# 2026-08-05. The FBNN link goes to the page that always has the current
# Humboldt & Pershing County mobile-pantry schedule PDF (the PDF's own
# filename embeds a revision date and moves each time FBNN updates it).
WATCHDOG_LOCAL_RESOURCES="Food Bank of Northern Nevada — Humboldt & Pershing County pantry schedule|https://www.fbnn.org/gethelp/neighborhoodpantry/,Winnemucca Events & Facilities Calendar|https://winnemucca.com/events-and-facilities-calendar/,Humboldt County Community Calendar|https://www.humboldtcountynv.gov/calendar.aspx,Pershing County NV (Lovelock/Imlay)|https://www.pershingcountynv.gov/"

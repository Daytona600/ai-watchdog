# AI Watchdog news brief config
#
# Pulls current world/USA headlines via the local SearXNG instance,
# restricted to an allowlist of wire-service domains so results are not
# left to algorithmic search ranking or SEO-driven aggregators.

WATCHDOG_NEWS_ENABLED="1"

SEARXNG_URL="http://10.0.0.35:8181"

# Comma-separated allowlist of domains treated as reliable wire services.
# Any SearXNG result outside this list is dropped before display — same
# enforcement approach as WATCHDOG_LLM_TRUSTED_DOMAINS in watchdog_llm.conf.
WATCHDOG_NEWS_TRUSTED_DOMAINS="apnews.com,reuters.com,npr.org,bbc.com,bbc.co.uk,pbs.org"

# Comma-separated search queries, run independently against SearXNG.
WATCHDOG_NEWS_QUERIES="world news today,United States news today"

# Max headlines kept per query after domain filtering.
WATCHDOG_NEWS_MAX_PER_QUERY="6"

WATCHDOG_NEWS_TIMEOUT_SEC="30"

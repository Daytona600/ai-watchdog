# AI Watchdog known hosts and thresholds
#
# This is the single place to update when a host's IP changes - every
# watchdog script and config file reads its host addresses from here
# (bash scripts via `source`, Python scripts via scripts/lib/watchdog_hosts.py,
# TSV config via ${VAR} placeholders expanded through that same module).
# You should not need to touch any other file when a box gets a new IP.

MAIN_SERVER_IP="10.0.0.35"
HA_SERVER_IP="10.0.0.30"

NAS_PRIMARY="10.0.0.100"
NAS_SECONDARY="10.0.0.6"

# Frigate / X99 box, on the 2.5Gb network. Updated 2026-08-15.
FRIGATE_HOST_IP="10.0.0.85"

# Bedroom Luna / Mary / Shaun unit (hostname bedroom-voice-satellite). Now
# wired (was WiFi at 10.0.0.123). Updated 2026-08-15, verified by SSH hostname.
BEDROOM_LUNA_IP="10.0.0.214"
BEDROOM_LUNA_OPENWAKEWORD_PORT="10400"

# Living room Luna / David unit (hostname front-room-satellite). Now wired
# (was WiFi at 10.0.0.71). Updated 2026-08-15, verified by SSH hostname.
LIVING_ROOM_IP="10.0.0.66"
LIVING_ROOM_OPENWAKEWORD_PORT="10400"

# Important:
# 10.0.0.123:10800 is NOT expected.
# If Node-RED reports ECONNREFUSED to 10.0.0.123:10800,
# likely cause is a stale Node-RED TCP/Wyoming Events node.

ROOT_DISK_WARN_PERCENT="80"
NAS_WARN_PERCENT="80"
GPU_VRAM_WARN_PERCENT="90"
